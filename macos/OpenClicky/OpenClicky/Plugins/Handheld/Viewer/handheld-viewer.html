<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Handheld</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font: 12px -apple-system, system-ui, sans-serif; -webkit-user-select: none; cursor: default; }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
  /* The name of the part under the pointer. */
  #part-label {
    position: absolute; left: 0; top: 0; padding: 3px 8px; border-radius: 6px; pointer-events: none;
    background: rgba(0, 0, 0, 0.78); color: white; font-weight: 600; opacity: 0; transition: opacity 0.12s;
    white-space: nowrap;
  }
  #status { position: absolute; left: 0; right: 0; top: 46%; text-align: center; color: rgba(128, 128, 128, 0.9); }
</style>
</head>
<body>
<canvas id="device" tabindex="-1" aria-label="The handheld. Click a button to choose what it does."></canvas>
<div id="part-label"></div>
<div id="status">Loading…</div>
<script type="module" src="viewer.js"></script>
</body>
</html>
