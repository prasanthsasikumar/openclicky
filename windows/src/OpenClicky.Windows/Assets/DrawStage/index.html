<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The drawing stage. No network: the program draws with what is here. 'unsafe-eval' is for the program worker,
     which runs the model's statements (stage-worker.js). -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-eval'; worker-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenClicky drawing</title>
<link rel="stylesheet" href="stage.css">
</head>
<body>
<div id="paper" hidden></div>
<div id="board">
<svg id="stage" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
<div id="figures"></div>
<svg id="labels3d" xmlns="http://www.w3.org/2000/svg"></svg>
</div>
<div id="caption" hidden></div>
<div id="tools" hidden>
<button type="button" class="quiz-me" data-act="quiz" hidden title="A few questions about this drawing"><span class="icon">&#xE897;</span><span class="label">Quiz me</span></button>
<button type="button" class="picture" data-save="picture" title="Save a picture of this drawing (PNG)"><span class="icon">&#xE8B9;</span><span class="label">Picture</span></button>
<button type="button" class="video" data-save="video" title="Save a video of this drawing being drawn, with its voice (MP4)"><span class="icon">&#xE714;</span><span class="label">Video</span></button>
<button type="button" class="pip" data-act="pip" title="Shrink it into the corner of the screen"><span class="icon">&#xE73F;</span></button>
<button type="button" class="close" data-act="close" title="Close the drawing (Esc)"><span class="icon">&#xE711;</span></button>
</div>
<div id="grip" class="grip right" hidden title="Drag to make the drawing bigger or smaller"></div>
<div id="grip-left" class="grip left" hidden title="Drag to make the drawing bigger or smaller"></div>
<div id="saving" hidden><span class="spinner"></span><span class="text"></span><span class="bar"><span></span></span></div>
<script src="stage.js"></script>
<script type="module" src="figure3d.js"></script>
</body>
</html>
